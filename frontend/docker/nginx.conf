# Served behind Cloudflare Tunnel: cloudflared is the only client that can
# reach this container (no published ports), and Cloudflare sets
# CF-Connecting-IP to the real visitor, so rate limits key on that.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

# The field service is looked up when a request needs it, so this proxy still
# starts (and serves the core app) while that container is being replaced.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/geo+json application/javascript
               text/css text/csv text/plain image/svg+xml;

    # add_header in a location replaces, not extends, the server's headers, so
    # every location that sets one includes the full security set.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The shell must never be cached, or a deploy is invisible until it expires.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The field screens: their own single-page app under /field/.
    location = /field/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location /field/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /field/ {
        try_files $uri $uri/ /field/index.html;
    }

    # Admin sign-in: the only place Cloudflare Access's assertion is passed on.
    location = /api/auth/access {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api_upstream/auth/access;
        include /etc/nginx/snippets/proxy.conf;
        proxy_set_header Cf-Access-Authenticated-User-Email "";
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api_upstream/;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/strip-access.conf;
    }

    # The field API keeps its own paths (/acs/{n}/field/...), media links included.
    location ~ ^/acs/[0-9]+/field/ {
        limit_req zone=api burst=60 nodelay;
        set $pulse pulse-api:8000;
        proxy_pass http://$pulse;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/strip-access.conf;
    }

    # Internal or development routes of either API are never reachable here.
    location ~ ^/(docs|redoc|openapi\.json|telegram/|health$) {
        return 404;
    }
}
