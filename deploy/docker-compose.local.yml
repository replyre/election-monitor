# Local rehearsal of the production stack: locally built images, no tunnel,
# nginx on 127.0.0.1:8080 only.
#
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local.yml up -d api web

services:
  api:
    image: giridih-api:local
  web:
    image: giridih-web:local
    ports: ["127.0.0.1:8080:8080"]
  jobs:
    image: giridih-jobs:local
    volumes: ["./.local-backups:/data/backups"]
