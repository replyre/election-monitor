name: deploy

# Every push to prod-azure that passes CI is built for the VM (linux/amd64),
# pushed to GHCR under its commit sha, and rolled out after a reviewer approves
# the `azure-production` environment. deploy.sh on the VM rolls back on its own if
# the new release does not answer /api/health.

on:
  push:
    branches: [prod-azure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false        # one failing scan must not cancel (and hide) the others
      matrix:
        include:
          - { name: api,   context: backend,       file: backend/docker/Dockerfile.api }
          - { name: jobs,  context: backend,       file: backend/docker/Dockerfile.jobs }
          - { name: pulse, context: field-service, file: field-service/docker/Dockerfile }
          - { name: web,   context: .,             file: frontend/docker/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/election-monitor-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: azure-production
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      RG: giridih-prod
      VM: giridih-vm
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out ${{ github.sha }}
        run: |
          deploy/vm/bundle.sh > /tmp/remote.sh
          # The registry token is a protected parameter: encrypted in transit,
          # never echoed, and it expires with this job.
          az vm run-command create -g "$RG" --vm-name "$VM" --name deploy \
            --script @/tmp/remote.sh \
            --parameters "IMAGE_TAG=${{ github.sha }}" "REGISTRY=ghcr.io/${{ github.repository_owner }}" \
            --protected-parameters "GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}" "GHCR_USER=${{ github.actor }}" \
            --async-execution false --timeout-in-seconds 900 -o none || true
          az vm run-command show -g "$RG" --vm-name "$VM" --name deploy --instance-view \
            --query 'instanceView' -o json > /tmp/result.json
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("/tmp/result.json"))
          print(r.get("output") or "")
          if r.get("error"):
              print(r["error"], file=sys.stderr)
          state, code = r.get("executionState"), r.get("exitCode")
          print(f"run-command: {state}, exit {code}")
          sys.exit(0 if state == "Succeeded" and code == 0 else 1)
          EOF
      - name: Remove the run-command record
        if: always()
        run: az vm run-command delete -g "$RG" --vm-name "$VM" --name deploy --yes -o none || true
